<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Favicon / small-size mark: just the orange key + checkmark.
       At 16-32px the text version is illegible; the check alone is the
       compact form of the brand. Use this anywhere the rendered size is
       below ~64px (browser tabs, dock icons, dense grids). -->
  <rect x="14" y="14" width="152" height="152" rx="38" fill="#f46800"/>
  <path d="M 50 90 L 78 118 L 136 60" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
