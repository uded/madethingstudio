  <text x="90" y="56" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.5">made</text>
  <path d="M 64 95 L 82 113 L 118 73" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="90" y="148" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.5">a thing</text>
</svg>
