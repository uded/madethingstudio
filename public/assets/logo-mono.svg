  <text x="90" y="80" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.5">made</text>
  <text x="90" y="124" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.5">a thing</text>
</svg>
