<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Option 1 v2 — Competitor hero refined</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body {
    width: 1920px; height: 1080px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; color: #fff;
    background:
      radial-gradient(1200px 700px at 50% -5%, rgba(244,104,0,0.30), transparent 60%),
      radial-gradient(1000px 700px at 50% 105%, rgba(70,80,150,0.25), transparent 60%),
      linear-gradient(180deg, #1a1428 0%, #0f0e1a 100%);
  }
  .scene {
    width: 100%; height: 100%; position: relative;
    display: flex; flex-direction: column; align-items: center;
  }
  /* Brand band */
  .brand {
    margin-top: 80px;
    display: flex; align-items: center; gap: 24px;
  }
  .grafana-sun {
    width: 90px; height: 90px;
    background: #f46800; border-radius: 50%;
    position: relative;
    box-shadow: 0 0 60px rgba(244,104,0,0.4);
  }
  /* simple sun-burst representation: lighter center + outer ring */
  .grafana-sun::before {
    content: ""; position: absolute; inset: 18px;
    background: #1a1428; border-radius: 50%;
  }
  .grafana-sun::after {
    content: ""; position: absolute; inset: 32px;
    background: #f46800; border-radius: 50%;
  }
  .brand-text {
    font-size: 72px; font-weight: 600; letter-spacing: -0.02em;
    color: #fff;
  }
  .tagline {
    margin-top: 26px; font-size: 26px; font-weight: 400;
    color: rgba(255,255,255,0.70); text-align: center; max-width: 1100px;
  }
  .tagline .pop { color: #f46800; font-weight: 600; }

  /* Deck illustration — partial, anchored to bottom */
  .deck {
    margin-top: 60px;
    width: 1340px; padding: 30px 42px 0;
    background: linear-gradient(180deg, #2c2c34 0%, #1a1a22 100%);
    border-radius: 36px 36px 0 0;
    border-top: 1.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 -50px 120px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.08);
    position: relative;
  }
  .deck-label {
    text-align: center; margin-bottom: 24px;
    font-size: 20px; font-weight: 600; letter-spacing: 0.20em;
    color: rgba(255,255,255,0.55);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .elgato-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); position: relative; }
  .elgato-dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: rgba(255,255,255,0.55); }
  .grid {
    display: grid; grid-template-columns: repeat(5, 220px); grid-template-rows: repeat(2, 220px);
    gap: 32px; justify-content: center;
  }
  .key {
    width: 220px; height: 220px; border-radius: 26px; background: #050608;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.06),
      inset 0 3px 8px rgba(0,0,0,0.7),
      0 6px 18px rgba(0,0,0,0.4);
    overflow: hidden; position: relative;
  }
  .key img { width: 100%; height: 100%; display: block; }
  .key::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 28%;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
  }

  /* Bottom anchor */
  .studio {
    position: absolute; bottom: 30px; left: 0; right: 0; text-align: center;
    font-size: 15px; color: rgba(255,255,255,0.30); letter-spacing: 0.10em;
  }
  .studio .name { color: rgba(255,255,255,0.75); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  .studio .dot { color: rgba(255,255,255,0.20); margin: 0 12px; }
</style>
</head>
<body>
<div class="scene">

  <div class="brand">
    <div class="brand-text">Grafana <span style="color: rgba(255,255,255,0.45); font-weight: 400;">for Stream Deck</span></div>
  </div>
  <div class="tagline">
    Live dashboard panels and alert states on every key. <span class="pop">Glanceable, threshold-aware, zero setup.</span>
  </div>

  <div class="deck">
    <div class="deck-label"><div class="elgato-dot"></div>STREAM DECK</div>
    <div class="grid">
      <div class="key"><img src="/public/assets/hero-key.svg"      alt="" /></div>
      <div class="key"><img src="/public/assets/tile-panel.svg"    alt="" /></div>
      <div class="key"><img src="/public/assets/tile-sparkline.svg" alt="" /></div>
      <div class="key"><img src="/public/assets/tile-gauge.svg"    alt="" /></div>
      <div class="key"><img src="/public/assets/tile-alerts.svg"   alt="" /></div>
      <div class="key"><img src="/public/assets/tile-panel.svg"    alt="" /></div>
      <div class="key"><img src="/public/assets/tile-gauge.svg"    alt="" /></div>
      <div class="key"><img src="/public/assets/tile-fire.svg"     alt="" /></div>
      <div class="key"><img src="/public/assets/hero-key.svg"      alt="" /></div>
      <div class="key"><img src="/public/assets/tile-sparkline.svg" alt="" /></div>
    </div>
  </div>

  <div class="studio">
    <span class="name">MADE A THING STUDIO</span>
    <span class="dot">·</span> FREE + PRO
    <span class="dot">·</span> ZERO TELEMETRY
  </div>
</div>
</body>
</html>
