<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Marquee 1920×1080</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body {
    width: 1920px; height: 1080px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
    /* Grafana brand: orange → dark navy. Saturated, marketplace-grade. */
    background:
      radial-gradient(1400px 800px at 50% -10%, rgba(244,104,0,0.35), transparent 60%),
      radial-gradient(1200px 700px at 50% 110%, rgba(70,90,180,0.25), transparent 65%),
      linear-gradient(180deg, #2a1810 0%, #1a1530 100%);
  }

  .scene {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0;
  }

  /* ── Top brand row ──────────────────────────────────────────────────── */
  .brand-row {
    display: flex; align-items: center; gap: 36px;
    margin-bottom: 28px;
  }
  /* Grafana logo (inline SVG of the brand mark) */
  .grafana-mark {
    width: 88px; height: 88px;
  }
  .brand-text {
    font-size: 76px; font-weight: 700; letter-spacing: -0.02em;
    color: #fff;
    text-shadow: 0 2px 16px rgba(0,0,0,0.3);
  }
  .brand-text .accent { color: #f46800; }

  /* ── Tagline ─────────────────────────────────────────────────────────── */
  .tagline {
    font-size: 26px; font-weight: 500; letter-spacing: 0.01em;
    color: rgba(255,255,255,0.75);
    margin-bottom: 60px;
    text-align: center;
  }
  .tagline .pop { color: #fff; font-weight: 600; }

  /* ── Stream Deck illustration ────────────────────────────────────────── */
  /* Partial deck — top edge visible with STREAM DECK brand, then the
     keys, then cropped at the bottom (positioned so the bottom of the
     viewport cuts the device). */
  .deck {
    width: 1280px;
    padding: 28px 40px 0;
    background:
      linear-gradient(180deg, #2a2a30 0%, #1a1a20 100%);
    border-radius: 32px 32px 0 0;
    border-top: 1px solid rgba(255,255,255,0.10);
    box-shadow:
      0 -40px 100px rgba(0,0,0,0.55),
      inset 0 2px 0 rgba(255,255,255,0.08);
    position: relative;
  }
  .stream-deck-label {
    text-align: center;
    margin-bottom: 22px;
    font-size: 22px; font-weight: 600; letter-spacing: 0.18em;
    color: rgba(255,255,255,0.55);
  }
  .stream-deck-label .logo {
    display: inline-block; width: 22px; height: 22px;
    vertical-align: middle; margin-right: 8px;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    position: relative;
  }
  .stream-deck-label .logo::after {
    content: ""; position: absolute; inset: 5px;
    border-radius: 50%; background: #1a1a20;
  }
  .stream-deck-label .logo::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px; transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.55); border-radius: 50%;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 200px);
    grid-template-rows: repeat(2, 200px);
    gap: 28px;
    justify-content: center;
  }
  .key {
    width: 200px; height: 200px;
    border-radius: 22px;
    background: #050608;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.06),
      inset 0 2px 6px rgba(0,0,0,0.7),
      0 4px 12px rgba(0,0,0,0.4),
      0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
    position: relative;
  }
  .key img { width: 100%; height: 100%; display: block; }
  /* Glass sheen */
  .key::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 28%;
    background: linear-gradient(180deg, rgba(255,255,255,0.07), transparent);
    pointer-events: none;
  }

  /* ── Bottom byline (sits below the deck cut, on the gradient) ───────── */
  /* The deck visually extends below the viewport — but the byline lives
     in the deck's negative space above it. */
  .byline {
    position: absolute; bottom: 38px; left: 0; right: 0;
    text-align: center;
    font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.55);
    letter-spacing: 0.02em;
  }
  .byline .dot { color: rgba(255,255,255,0.25); margin: 0 14px; }
  .byline .studio { color: #fff; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 16px; margin-bottom: 8px; display: block; }
</style>
</head>
<body>
<div class="scene">

  <!-- ── Brand row ─────────────────────────────────────────────────────── -->
  <div class="brand-row">
    <!-- Grafana mark — simplified version of the Grafana logo for marquee use -->
    <svg class="grafana-mark" viewBox="0 0 100 100" fill="#fff" aria-hidden="true">
      <path d="M50 8 C 50 8, 38 14, 36 24 C 34 26, 32 28, 32 32 C 28 32, 24 34, 22 38 C 18 38, 14 42, 14 48 C 10 52, 8 58, 12 64 C 14 70, 20 74, 26 74 C 26 74, 28 76, 30 76 C 30 80, 34 82, 38 80 C 38 82, 40 84, 44 84 C 44 88, 50 90, 54 88 C 56 92, 62 92, 66 90 C 72 92, 78 88, 78 82 C 84 80, 86 74, 84 68 C 88 64, 88 58, 84 54 C 84 50, 80 46, 76 46 C 76 40, 72 36, 66 36 C 66 32, 62 28, 58 28 C 58 22, 54 18, 50 18 C 50 14, 50 10, 50 8 Z M 50 28 C 60 28, 68 36, 68 46 C 68 56, 60 64, 50 64 C 40 64, 32 56, 32 46 C 32 36, 40 28, 50 28 Z" />
      <circle cx="50" cy="46" r="10" fill="#fff" />
    </svg>
    <div class="brand-text">Grafana<span class="accent">.</span></div>
  </div>

  <!-- ── Tagline ──────────────────────────────────────────────────────── -->
  <div class="tagline">
    Your dashboards on your <span class="pop">Stream Deck</span>.
    Live, glanceable, zero setup.
  </div>

  <!-- ── Device illustration ─────────────────────────────────────────── -->
  <div class="deck">
    <div class="stream-deck-label">
      <span class="logo"></span>STREAM DECK
    </div>
    <div class="grid">
      <div class="key"><img src="/public/assets/hero-key.svg"      alt="" /></div>
      <div class="key"><img src="/public/assets/tile-panel.svg"    alt="" /></div>
      <div class="key"><img src="/public/assets/tile-sparkline.svg" alt="" /></div>
      <div class="key"><img src="/public/assets/tile-gauge.svg"    alt="" /></div>
      <div class="key"><img src="/public/assets/tile-alerts.svg"   alt="" /></div>
      <div class="key"><img src="/public/assets/tile-panel.svg"    alt="" /></div>
      <div class="key"><img src="/public/assets/tile-gauge.svg"    alt="" /></div>
      <div class="key"><img src="/public/assets/tile-fire.svg"     alt="" /></div>
      <div class="key"><img src="/public/assets/hero-key.svg"      alt="" /></div>
      <div class="key"><img src="/public/assets/tile-sparkline.svg" alt="" /></div>
    </div>
  </div>

  <!-- ── Bottom byline ───────────────────────────────────────────────── -->
  <div class="byline">
    <span class="studio">Made A Thing Studio</span>
    Free + Pro <span class="dot">·</span>
    macOS + Windows <span class="dot">·</span>
    Zero telemetry
  </div>

</div>
</body>
</html>
