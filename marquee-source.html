<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Marquee 1920×1080</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0c0e; overflow: hidden; }
  body { width: 1920px; height: 1080px; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; color: #e8e6e3; }

  /* Atmospheric halos — a warm Grafana-orange behind the deck, plus a cooler tint
     in the upper-right to add depth without screaming. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(800px 600px at 78% 60%, rgba(244,104,0,0.20), transparent 55%),
      radial-gradient(900px 500px at 60% 100%, rgba(244,104,0,0.10), transparent 60%),
      radial-gradient(700px 400px at 95% 0%, rgba(80,100,150,0.10), transparent 55%);
  }

  .scene { position: relative; width: 100%; height: 100%; display: grid;
           grid-template-columns: 720px 1fr; align-items: center; gap: 80px; padding: 0 0 0 120px; box-sizing: border-box; }

  /* ── Copy ─────────────────────────────────────────────────────────────── */
  .brand {
    font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: #8a8a8e; margin-bottom: 40px;
  }
  .brand .accent { color: #e8e6e3; }
  h1 {
    margin: 0;
    font-size: 76px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05;
  }
  h1 .pop { color: #f46800; }
  .byline {
    margin-top: 44px;
    font-size: 22px; color: #8a8a8e; letter-spacing: 0.01em;
  }
  .byline .dot { color: #444; margin: 0 14px; }

  /* ── Device — Stream Deck MK.2 5×3 illustration ───────────────────────── */
  /*  Bezel is a rounded rect with a soft inner shadow (LCD recess) and
      an upward highlight on the top edge for material feel. The whole
      assembly is tilted ~6° on Y for a perspective that reads as
      "product photo" without being aggressive. */
  .deck-wrap {
    perspective: 1800px;
    perspective-origin: 50% 60%;
    transform: translateY(-40px);
  }
  .deck {
    width: 800px; padding: 32px;
    background: linear-gradient(180deg, #1f2024 0%, #15161a 100%);
    border-radius: 28px;
    box-shadow:
      0 60px 100px -20px rgba(0,0,0,0.65),
      0 30px 50px -10px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -2px 0 rgba(0,0,0,0.4);
    transform: rotateY(-8deg) rotateX(4deg);
    transform-style: preserve-3d;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 132px);
    grid-template-rows: repeat(3, 132px);
    gap: 16px;
  }
  .key {
    width: 132px; height: 132px;
    border-radius: 16px;
    background: #0a0b0d;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.04),
      inset 0 2px 4px rgba(0,0,0,0.6),
      0 1px 0 rgba(255,255,255,0.02);
    overflow: hidden;
    display: block;
  }
  .key img { width: 100%; height: 100%; display: block; }

  /* Logo nub at the top-right corner of the deck (cosmetic device cue) */
  .nub {
    position: absolute; top: 12px; right: 24px;
    width: 36px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, #2a2c30, #1a1b1e);
    transform: translateZ(2px);
  }
</style>
</head>
<body>
<div class="scene">

  <!-- ── Copy ────────────────────────────────────────────────────────── -->
  <div class="copy">
    <div class="brand"><span class="accent">Made A Thing</span> Studio</div>
    <h1>
      Grafana on your
      <span class="pop">Stream Deck</span>.
      Zero setup required.
    </h1>
    <div class="byline">
      Free + Pro <span class="dot">·</span>
      macOS + Windows <span class="dot">·</span>
      Zero telemetry
    </div>
  </div>

  <!-- ── Device ──────────────────────────────────────────────────────── -->
  <div class="deck-wrap">
    <div class="deck">
      <div class="nub"></div>
      <div class="grid">
        <!-- Row 1: hero on left, then sparkline + gauge -->
        <div class="key"><img src="/public/assets/hero-key.svg"      alt="" /></div>
        <div class="key"><img src="/public/assets/tile-panel.svg"    alt="" /></div>
        <div class="key"><img src="/public/assets/tile-sparkline.svg" alt="" /></div>
        <div class="key"><img src="/public/assets/tile-gauge.svg"    alt="" /></div>
        <div class="key"><img src="/public/assets/tile-alerts.svg"   alt="" /></div>
        <!-- Row 2: variation -->
        <div class="key"><img src="/public/assets/tile-panel.svg"    alt="" /></div>
        <div class="key"><img src="/public/assets/tile-gauge.svg"    alt="" /></div>
        <div class="key"><img src="/public/assets/hero-key.svg"      alt="" /></div>
        <div class="key"><img src="/public/assets/tile-fire.svg"     alt="" /></div>
        <div class="key"><img src="/public/assets/tile-sparkline.svg" alt="" /></div>
        <!-- Row 3: bottom -->
        <div class="key"><img src="/public/assets/tile-alerts.svg"   alt="" /></div>
        <div class="key"><img src="/public/assets/tile-sparkline.svg" alt="" /></div>
        <div class="key"><img src="/public/assets/tile-panel.svg"    alt="" /></div>
        <div class="key"><img src="/public/assets/tile-gauge.svg"    alt="" /></div>
        <div class="key"><img src="/public/assets/hero-key.svg"      alt="" /></div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
